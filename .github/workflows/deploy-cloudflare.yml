name: Deploy CHIDOLIRO to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chidoliro-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Worker + static assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Cloudflare configuration
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Configure repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID before deploying."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static assets
        run: npm run build:cloudflare

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Record deployed commit
        run: echo "Deployed CHIDOLIRO commit ${GITHUB_SHA}"
