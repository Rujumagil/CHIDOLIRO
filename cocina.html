<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04171b">
<title>CHIDOLIRO · Comandas</title>
<style>
:root{--ocean:#082a31;--ocean2:#0d3a43;--teal:#137a7e;--aqua:#7bc9c4;--cream:#f6f0e7;--amber:#f09a52;--ink:#152728;--muted:#72807e;--line:rgba(21,39,40,.12);--danger:#b83c3c;--ok:#27784a;--shadow:0 18px 50px rgba(0,0,0,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#04171b;color:white}button,input{font:inherit}.hidden{display:none!important}
.login{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#0e5055 0,#06252b 38%,#04171b 72%)}.loginCard{width:min(100%,430px);background:rgba(246,240,231,.98);color:var(--ink);border-radius:28px;padding:28px;box-shadow:var(--shadow)}.brand{display:flex;align-items:center;gap:12px}.brand img{width:62px;height:62px;object-fit:contain}.brand b{display:block;letter-spacing:.12em}.brand small{display:block;color:var(--teal);font-size:.68rem;font-weight:800;letter-spacing:.11em;margin-top:3px}.loginCard h1{font-size:2.25rem;line-height:1;margin:30px 0 7px}.loginCard p{color:var(--muted);font-size:.88rem;line-height:1.55}.pin{width:100%;height:60px;border:1px solid var(--line);border-radius:16px;background:white;color:var(--ink);font-size:1.45rem;font-weight:900;letter-spacing:.28em;text-align:center;outline:none;margin-top:12px}.pin:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(19,122,126,.1)}.loginBtn{width:100%;height:54px;border:0;border-radius:16px;background:var(--ocean);color:white;font-weight:900;margin-top:10px}.error{min-height:22px;color:var(--danger);font-size:.75rem;font-weight:800;margin-top:9px;text-align:center}
.app{min-height:100dvh;background:#edf0eb;color:var(--ink)}.top{position:sticky;top:0;z-index:30;background:rgba(4,23,27,.96);backdrop-filter:blur(16px);color:white;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.08)}.topRow{max-width:1500px;margin:auto;display:flex;align-items:center;gap:12px}.top .brand img{width:46px;height:46px}.top .brand small{color:var(--aqua)}.topActions{margin-left:auto;display:flex;gap:7px;align-items:center}.live{display:flex;align-items:center;gap:7px;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.07);font-size:.7rem;font-weight:800;color:#cde7e2}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:#4bc276;box-shadow:0 0 0 4px rgba(75,194,118,.15)}.iconBtn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:white;border-radius:12px;min-height:40px;padding:0 12px;font-weight:800}.main{max-width:1500px;margin:auto;padding:18px 14px 40px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{background:white;border:1px solid var(--line);border-radius:18px;padding:14px}.stat small{display:block;color:var(--muted);font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.stat strong{display:block;font-size:1.8rem;margin-top:5px}.toolbar{display:flex;gap:8px;align-items:center;margin:14px 0;overflow:auto;padding-bottom:3px}.filter{border:1px solid var(--line);background:white;color:var(--ink);border-radius:999px;padding:9px 13px;font-size:.75rem;font-weight:900;white-space:nowrap}.filter.active{background:var(--ocean);color:white;border-color:var(--ocean)}.updated{margin-left:auto;color:var(--muted);font-size:.7rem;white-space:nowrap}.orders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}.order{background:white;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 9px 28px rgba(5,27,31,.08)}.orderHead{padding:15px 16px 12px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line)}.orderNo{font-size:1.55rem;font-weight:950;line-height:1}.orderMeta{color:var(--muted);font-size:.7rem;font-weight:700;margin-top:4px}.elapsed{margin-left:auto;border-radius:999px;padding:7px 10px;font-size:.72rem;font-weight:900;background:#edf1eb;color:var(--ocean)}.elapsed.warn{background:#fff0df;color:#a45d18}.elapsed.late{background:#fde4e4;color:#a33333}.status{display:inline-flex;margin:12px 16px 0;padding:6px 9px;border-radius:999px;font-size:.64rem;font-weight:950;text-transform:uppercase;letter-spacing:.08em}.s-submitted{background:#fff0df;color:#9a591d}.s-accepted{background:#e6f0f3;color:#1f596a}.s-preparing{background:#e4f0ed;color:#1d6d5d}.s-ready{background:#dff1e5;color:#247444}.s-delivered{background:#eeeeeb;color:#6f7772}.s-cancelled{background:#fde5e5;color:#a23e3e}.body{padding:13px 16px}.customer{font-size:.76rem;font-weight:900;margin-bottom:10px}.customer span{color:var(--teal)}.items{display:grid;gap:9px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:start}.qty{width:30px;height:30px;border-radius:10px;background:var(--ocean);color:white;display:grid;place-items:center;font-size:.78rem;font-weight:900}.item b{display:block;font-size:.84rem;line-height:1.15}.opts{color:var(--muted);font-size:.66rem;line-height:1.4;margin-top:3px}.price{font-size:.72rem;font-weight:900}.notes{margin-top:12px;padding:10px 11px;border-radius:13px;background:#fff8ed;border:1px solid #f0dcc0;font-size:.72rem;line-height:1.4}.total{display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding-top:12px;border-top:1px solid var(--line);font-size:.78rem}.total strong{font-size:1.02rem}.actions{display:grid;grid-template-columns:1fr auto;gap:7px;padding:0 16px 15px}.next{border:0;border-radius:14px;background:var(--amber);color:#25160b;min-height:46px;padding:0 14px;font-weight:950}.cancel{border:1px solid var(--line);border-radius:14px;background:white;color:var(--danger);min-height:46px;padding:0 12px;font-weight:900}.empty{grid-column:1/-1;background:white;border:1px dashed #c8d0ca;border-radius:22px;padding:50px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:5px}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#04171b;color:white;padding:11px 14px;border-radius:13px;font-size:.75rem;font-weight:850;box-shadow:var(--shadow);transition:.2s;z-index:100}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1050px){.orders{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.orders{grid-template-columns:1fr}.top .brand b{font-size:.78rem}.topActions .live{display:none}.iconBtn{padding:0 9px}.main{padding:12px 10px 30px}.updated{display:none}.order{border-radius:18px}}
</style>
</head>
<body>
<section class="login" id="loginView">
  <div class="loginCard">
    <div class="brand"><img src="assets/logo.png" alt="CHIDOLIRO"><div><b>CHIDOLIRO</b><small>COMANDAS · COCINA</small></div></div>
    <h1>Centro de cocina</h1>
    <p>Acceso interno para recibir pedidos y avanzar cada comanda hasta que esté lista.</p>
    <form id="loginForm"><input class="pin" id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••"><button class="loginBtn" type="submit">Entrar a comandas</button></form>
    <div class="error" id="loginError"></div>
  </div>
</section>

<section class="app hidden" id="appView">
  <header class="top"><div class="topRow">
    <div class="brand"><img src="assets/logo.png" alt="CHIDOLIRO"><div><b>CHIDOLIRO</b><small>COMANDAS EN VIVO</small></div></div>
    <div class="topActions"><div class="live">Actualización automática</div><button class="iconBtn" id="pinBtn" type="button">PIN</button><button class="iconBtn" id="logoutBtn" type="button">Salir</button></div>
  </div></header>
  <main class="main">
    <section class="summary"><div class="stat"><small>Nuevos</small><strong id="countNew">0</strong></div><div class="stat"><small>Preparando</small><strong id="countPreparing">0</strong></div><div class="stat"><small>Listos</small><strong id="countReady">0</strong></div><div class="stat"><small>Activos</small><strong id="countActive">0</strong></div></section>
    <div class="toolbar" id="filters"><button class="filter active" data-filter="active">Activos</button><button class="filter" data-filter="submitted">Nuevos</button><button class="filter" data-filter="preparing">Preparando</button><button class="filter" data-filter="ready">Listos</button><button class="filter" data-filter="all">Todos</button><span class="updated" id="updated">—</span></div>
    <section class="orders" id="orders"></section>
  </main>
</section>
<div class="toast" id="toast"></div>
<script>
(()=>{
  const KEY='chidoliro_kitchen_session';
  const state={session:sessionStorage.getItem(KEY)||'',orders:[],filter:'active',timer:null,lastIds:new Set(),soundEnabled:false};
  const labels={submitted:'Nuevo',accepted:'Aceptado',preparing:'Preparando',ready:'Listo',delivered:'Entregado',cancelled:'Cancelado'};
  const nextStatus={submitted:['accepted','Aceptar'],accepted:['preparing','Preparar'],preparing:['ready','Marcar listo'],ready:['delivered','Entregar']};
  const loginView=document.getElementById('loginView'),appView=document.getElementById('appView'),ordersEl=document.getElementById('orders');
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function money(v){return '$'+Number(v||0).toLocaleString('es-MX',{maximumFractionDigits:2})}
  function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
  function age(created){const min=Math.max(0,Math.floor((Date.now()-new Date(created).getTime())/60000));return min<1?'ahora':min<60?`${min} min`:`${Math.floor(min/60)}h ${min%60}m`}
  function ageClass(created){const min=(Date.now()-new Date(created).getTime())/60000;return min>=20?'late':min>=10?'warn':''}
  function optText(options){if(!Array.isArray(options)||!options.length)return'';return options.map(o=>o.name||o.option_name||o.label||'').filter(Boolean).join(' · ')}
  async function api(method='GET',body){const headers={'Content-Type':'application/json'};if(state.session)headers.Authorization=`Bearer ${state.session}`;const r=await fetch('/api/kitchen',{method,cache:'no-store',headers,body:method==='POST'?JSON.stringify(body||{}):undefined});const p=await r.json().catch(()=>null);if(r.status===401&&body?.action!=='login'){logoutLocal();throw new Error('Sesión vencida');}if(!r.ok||!p?.ok)throw new Error(p?.error||'No se pudo conectar');return p}
  function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden');state.soundEnabled=true;load();state.timer=setInterval(load,5000)}
  function showLogin(){appView.classList.add('hidden');loginView.classList.remove('hidden');document.getElementById('pin').focus()}
  function logoutLocal(){state.session='';sessionStorage.removeItem(KEY);clearInterval(state.timer);showLogin()}
  function counts(){const active=state.orders.filter(o=>!['delivered','cancelled'].includes(o.status));document.getElementById('countNew').textContent=state.orders.filter(o=>['submitted','accepted'].includes(o.status)).length;document.getElementById('countPreparing').textContent=state.orders.filter(o=>o.status==='preparing').length;document.getElementById('countReady').textContent=state.orders.filter(o=>o.status==='ready').length;document.getElementById('countActive').textContent=active.length}
  function filtered(){if(state.filter==='all')return state.orders;if(state.filter==='active')return state.orders.filter(o=>!['delivered','cancelled'].includes(o.status));if(state.filter==='submitted')return state.orders.filter(o=>['submitted','accepted'].includes(o.status));return state.orders.filter(o=>o.status===state.filter)}
  function render(){counts();const rows=filtered();if(!rows.length){ordersEl.innerHTML='<div class="empty"><strong>No hay comandas en esta vista</strong>Los nuevos pedidos aparecerán automáticamente.</div>';return}
    ordersEl.innerHTML=rows.map(o=>{const next=nextStatus[o.status];const customer=o.order_type==='table'?`Mesa <span>${esc(o.table_reference||'—')}</span>`:`Para llevar · <span>${esc(o.customer_name||'Sin nombre')}</span>`;const items=(o.items||[]).map(i=>`<div class="item"><div class="qty">${Number(i.quantity||1)}×</div><div><b>${esc(i.item_name)}</b>${optText(i.selected_options)?`<div class="opts">${esc(optText(i.selected_options))}</div>`:''}${i.notes?`<div class="opts">Nota: ${esc(i.notes)}</div>`:''}</div><div class="price">${money(i.line_total)}</div></div>`).join('');return `<article class="order" data-order="${esc(o.id)}"><div class="orderHead"><div><div class="orderNo">#${esc(o.order_number)}</div><div class="orderMeta">${o.order_type==='table'?'🍽 Mesa':'🛍 Para llevar'} · ${new Date(o.created_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="elapsed ${ageClass(o.created_at)}">${age(o.created_at)}</div></div><div class="status s-${esc(o.status)}">${labels[o.status]||o.status}</div><div class="body"><div class="customer">${customer}</div><div class="items">${items}</div>${o.notes?`<div class="notes"><b>Nota general:</b> ${esc(o.notes)}</div>`:''}<div class="total"><span>${(o.items||[]).reduce((s,i)=>s+Number(i.quantity||0),0)} productos</span><strong>${money(o.total)}</strong></div></div><div class="actions">${next?`<button class="next" data-status="${next[0]}" data-id="${esc(o.id)}">${next[1]}</button>`:'<div></div>'}${!['delivered','cancelled'].includes(o.status)?`<button class="cancel" data-status="cancelled" data-id="${esc(o.id)}">Cancelar</button>`:''}</div></article>`}).join('');
    ordersEl.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>update(b.dataset.id,b.dataset.status,b)));
  }
  function beep(){if(!state.soundEnabled)return;try{const A=window.AudioContext||window.webkitAudioContext;const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.04,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.18)}catch(_){}}
  async function load(){try{const p=await api('GET');const incoming=p.orders||[];const ids=new Set(incoming.filter(o=>o.status==='submitted').map(o=>o.id));if(state.lastIds.size&&[...ids].some(id=>!state.lastIds.has(id)))beep();state.lastIds=ids;state.orders=incoming;render();document.getElementById('updated').textContent='Actualizado '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch(e){toast(e.message)}}
  async function update(id,status,button){if(status==='cancelled'&&!confirm('¿Cancelar esta comanda?'))return;button.disabled=true;try{await api('POST',{action:'update',order_id:id,status});await load();toast(status==='ready'?'Comanda lista':status==='delivered'?'Pedido entregado':'Estado actualizado')}catch(e){toast(e.message)}finally{button.disabled=false}}
  document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const pin=document.getElementById('pin').value.replace(/\D/g,'').slice(0,6),err=document.getElementById('loginError');err.textContent='';if(pin.length!==6){err.textContent='Ingresa los 6 dígitos.';return}try{const p=await api('POST',{action:'login',pin});state.session=p.token;sessionStorage.setItem(KEY,p.token);document.getElementById('pin').value='';showApp()}catch(x){err.textContent=x.message==='invalid_pin'?'PIN incorrecto.':x.message==='too_many_attempts'?'Demasiados intentos. Espera 15 minutos.':'No pudimos iniciar sesión.'}});
  document.getElementById('filters').querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()}));
  document.getElementById('logoutBtn').addEventListener('click',async()=>{try{await api('POST',{action:'logout'})}catch(_){}logoutLocal()});
  document.getElementById('pinBtn').addEventListener('click',async()=>{const n=prompt('Nuevo PIN de 6 dígitos:');if(n===null)return;const pin=String(n).replace(/\D/g,'').slice(0,6);if(pin.length!==6){toast('El PIN debe tener 6 dígitos.');return}try{await api('POST',{action:'change_pin',new_pin:pin});toast('PIN actualizado.')}catch(e){toast(e.message)}});
  if(state.session)showApp();else showLogin();
})();
</script>
</body>
</html>
