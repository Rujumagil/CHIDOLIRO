<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061f24"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>CHIDOLIRO Control</title><link rel="manifest" href="/control-manifest.json"><link rel="apple-touch-icon" href="/assets/icon-192.png"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061f24}#controlFrame{display:block;width:100%;height:100dvh;border:0;background:#eef2ee}</style></head><body><iframe id="controlFrame" src="/control-v21.html?v=3" title="CHIDOLIRO Control" allow="clipboard-write"></iframe><script>(()=>{const KEY='chidoliro_kitchen_session',frame=document.getElementById('controlFrame');let lastToken=localStorage.getItem(KEY)||'',restoring=false;sessionStorage.setItem('chidoliro_control_mode','1');async function registerSW(){if('serviceWorker'in navigator){try{await navigator.serviceWorker.register('/service-worker.js',{scope:'/',updateViaCache:'none'})}catch(_){}}}function child(){try{return frame.contentWindow}catch(_){return null}}function syncAfterLoad(){const w=child();if(!w)return;try{let token=w.sessionStorage.getItem(KEY)||'';const saved=localStorage.getItem(KEY)||'';if(!token&&saved&&!restoring){restoring=true;w.sessionStorage.setItem(KEY,saved);w.location.reload();return}restoring=false;if(token){localStorage.setItem(KEY,token);lastToken=token}else if(lastToken){localStorage.removeItem(KEY);lastToken=''}const d=w.document;if(d&&!d.__chidoliroLogoutHook){d.__chidoliroLogoutHook=true;d.addEventListener('click',e=>{const b=e.target&&e.target.closest?e.target.closest('#logout,[data-logout]'):null;if(b){localStorage.removeItem(KEY);lastToken=''}},true)}}catch(_){}}frame.addEventListener('load',syncAfterLoad);setInterval(()=>{const w=child();if(!w)return;try{const token=w.sessionStorage.getItem(KEY)||'';if(token&&token!==lastToken){localStorage.setItem(KEY,token);lastToken=token}if(!token&&lastToken){const d=w.document,login=d&&d.getElementById('loginView'),app=d&&d.getElementById('appView');if(login&&(!app||app.classList.contains('hidden'))){localStorage.removeItem(KEY);lastToken=''}}}catch(_){}},500);registerSW()})();</script></body></html>
