<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#031114"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>CHIDOLIRO Control</title><link rel="manifest" href="/control-manifest.json"><link rel="apple-touch-icon" href="/assets/icon-192.png"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#031114}#controlFrame{display:block;width:100%;height:100dvh;border:0;background:#031114}</style></head><body><iframe id="controlFrame" src="/control-v21.html?v=6" title="CHIDOLIRO Control" allow="clipboard-write"></iframe><script>(()=>{const KEY='chidoliro_kitchen_session',frame=document.getElementById('controlFrame');let lastToken=localStorage.getItem(KEY)||'',restoring=false,patchTimer=null;sessionStorage.setItem('chidoliro_control_mode','1');async function registerSW(){if('serviceWorker'in navigator){try{await navigator.serviceWorker.register('/service-worker.js',{scope:'/',updateViaCache:'none'})}catch(_){}}}function child(){try{return frame.contentWindow}catch(_){return null}}function injectTheme(){const w=child();if(!w)return;try{const d=w.document;if(!d||!d.head)return;if(!d.getElementById('chidoliroFutureTheme')){const l=d.createElement('link');l.id='chidoliroFutureTheme';l.rel='stylesheet';l.href='/control-future.css?v=2';d.head.appendChild(l)}if(!d.getElementById('chidoliroV3Css')){const l=d.createElement('link');l.id='chidoliroV3Css';l.rel='stylesheet';l.href='/control-v3.css?v=1';d.head.appendChild(l)}if(!d.getElementById('chidoliroV3Js')&&d.body){const s=d.createElement('script');s.id='chidoliroV3Js';s.src='/control-v3.js?v=1';s.defer=true;d.body.appendChild(s)}d.documentElement.style.colorScheme='dark'}catch(_){}}function titleCase(v){return String(v||'').trim().replace(/(^|\s|[-_])([a-záéíóúñ])/g,(_,a,b)=>a+b.toUpperCase())}function preferredName(u){const display=String(u?.display_name||u?.name||'').trim(),username=String(u?.username||u?.user_name||'').trim();if(!display||/^(admin|administrator|administrador)$/i.test(display))return titleCase(username)||'Usuario';return display}async function requestJSON(url,options={}){const r=await fetch(url,{cache:'no-store',...options});const p=await r.json().catch(()=>null);if(!r.ok)throw new Error(p?.error||'request_failed');return p}function stationStats(p){let active=0,ready=0,preparing=0;for(const o of Array.isArray(p?.orders)?p.orders:[]){for(const i of Array.isArray(o?.items)?o.items:[]){if(['delivered','cancelled'].includes(i.status))continue;active++;if(i.status==='ready')ready++;if(i.status==='preparing')preparing++}}return{active,ready,preparing}}function deliveryStats(p){const rows=Array.isArray(p?.deliveries)?p.deliveries:[];const pending=rows.filter(x=>x.status==='ready'&&!x.delivered_at);return{pending:pending.length,maxWait:pending.reduce((m,x)=>Math.max(m,Number(x.ready_wait_seconds||0)),0)}}function setLiveCard(d,prefix,s){const strong=d.getElementById('live'+prefix),note=d.getElementById('live'+prefix+'Note'),card=d.getElementById('live'+prefix+'Card');if(!strong||!note||!card)return;strong.textContent=s.active;note.textContent=s.ready?`${s.preparing} preparando · ${s.ready} listos`:`${s.preparing} preparando`;card.classList.remove('ok','warn','danger');card.classList.add(s.active===0?'ok':s.ready>0?'danger':'warn')}function setDeliveryCard(d,s){const strong=d.getElementById('liveDelivery'),note=d.getElementById('liveDeliveryNote'),card=d.getElementById('liveDeliveryCard');if(!strong||!note||!card)return;strong.textContent=s.pending;note.textContent=s.pending?(s.maxWait>=60?`máx. ${Math.floor(s.maxWait/60)} min esperando`:'recién listos'):'sin pendientes';card.classList.remove('ok','warn','danger');card.classList.add(s.pending===0?'ok':s.maxWait>=300?'danger':'warn')}async function patchDashboard(){const w=child();if(!w)return;let d;try{d=w.document;injectTheme()}catch(_){return}if(!d||!d.getElementById('appView')||d.getElementById('appView').classList.contains('hidden'))return;const token=w.sessionStorage.getItem(KEY)||localStorage.getItem(KEY)||'';if(!token)return;try{const profile=await requestJSON('/api/kitchen',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({action:'profile'})});const u=profile?.user||profile?.profile||profile?.staff||profile?.data?.user||profile||{};const name=preferredName(u);const userName=d.getElementById('userName');if(userName)userName.textContent=name;const greeting=d.getElementById('greeting');if(greeting){const h=new Date().getHours(),g=h<12?'Buenos días':h<19?'Buenas tardes':'Buenas noches';greeting.textContent=`${g}, ${name}`}}catch(_){}let kitchen={active:0,ready:0,preparing:0},bar={active:0,ready:0,preparing:0},delivery={pending:0,maxWait:0};try{kitchen=stationStats(await requestJSON('/api/kitchen?station=kitchen',{headers:{Authorization:`Bearer ${token}`}}));setLiveCard(d,'Kitchen',kitchen)}catch(_){}try{bar=stationStats(await requestJSON('/api/kitchen?station=bar',{headers:{Authorization:`Bearer ${token}`}}));setLiveCard(d,'Bar',bar)}catch(_){}try{delivery=deliveryStats(await requestJSON('/api/kitchen',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},body:JSON.stringify({action:'delivery_list'})}));setDeliveryCard(d,delivery)}catch(_){}const activeOrders=Number(String(d.getElementById('activeOrders')?.textContent||'0').replace(/\D/g,''))||0;if(activeOrders>0&&kitchen.active===0&&bar.active===0){const kn=d.getElementById('liveKitchenNote'),bn=d.getElementById('liveBarNote');if(kn)kn.textContent=`${activeOrders} comanda${activeOrders===1?'':'s'} sin unidades activas`;if(bn)bn.textContent='sin bebidas activas'}const att=d.getElementById('attention'),attText=d.getElementById('attentionText');if(att&&attText){const txt=String(attText.textContent||'').trim();if(/^\d+\s+comandas?\s+activas?$/i.test(txt))att.classList.add('hidden')}}function syncAfterLoad(){const w=child();if(!w)return;try{injectTheme();let token=w.sessionStorage.getItem(KEY)||'';const saved=localStorage.getItem(KEY)||'';if(!token&&saved&&!restoring){restoring=true;w.sessionStorage.setItem(KEY,saved);w.location.reload();return}restoring=false;if(token){localStorage.setItem(KEY,token);lastToken=token}else if(lastToken){localStorage.removeItem(KEY);lastToken=''}const d=w.document;if(d&&!d.__chidoliroLogoutHook){d.__chidoliroLogoutHook=true;d.addEventListener('click',e=>{const b=e.target&&e.target.closest?e.target.closest('#logout,[data-logout]'):null;if(b){localStorage.removeItem(KEY);lastToken=''}},true)}clearInterval(patchTimer);patchTimer=setInterval(patchDashboard,5000);setTimeout(patchDashboard,250)}catch(_){}}frame.addEventListener('load',syncAfterLoad);setInterval(()=>{const w=child();if(!w)return;try{injectTheme();const token=w.sessionStorage.getItem(KEY)||'';if(token&&token!==lastToken){localStorage.setItem(KEY,token);lastToken=token}if(!token&&lastToken){const d=w.document,login=d&&d.getElementById('loginView'),app=d&&d.getElementById('appView');if(login&&(!app||app.classList.contains('hidden'))){localStorage.removeItem(KEY);lastToken=''}}}catch(_){}},700);registerSW()})();</script></body></html>
