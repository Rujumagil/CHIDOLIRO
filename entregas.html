<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#04171b"><title>CHIDOLIRO · Entregas</title><style>
:root{--ocean:#082a31;--teal:#137a7e;--aqua:#7bc9c4;--cream:#f6f0e7;--amber:#f09a52;--ink:#152728;--muted:#6b7977;--line:rgba(21,39,40,.12);--ok:#27784a;--warn:#a4611c;--danger:#b43b3b;--shadow:0 18px 50px rgba(0,0,0,.16)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#edf0eb;color:var(--ink)}button{font:inherit}.hidden{display:none!important}.top{position:sticky;top:0;z-index:30;background:#04171b;color:white;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08)}.topRow{max-width:1350px;margin:auto;display:flex;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px;object-fit:contain}.brand b{display:block;letter-spacing:.1em}.brand small{display:block;color:var(--aqua);font-size:.61rem;font-weight:900;letter-spacing:.09em}.topActions{margin-left:auto;display:flex;gap:7px}.topActions a,.topActions button{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:white;border-radius:11px;min-height:40px;padding:0 10px;font-weight:850;text-decoration:none;display:flex;align-items:center}.main{max-width:1350px;margin:auto;padding:14px 10px 40px}.hero{background:linear-gradient(135deg,#082a31,#0d4b51);border-radius:22px;padding:20px;color:white;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,rgba(123,201,196,.24),transparent 26%)}.heroText{position:relative;z-index:2}.hero small{color:#a9dcd6;font-size:.61rem;font-weight:900;letter-spacing:.1em}.hero h1{font-size:2rem;margin:5px 0 6px}.hero p{margin:0;color:#c5dbd7;font-size:.74rem;line-height:1.5;max-width:690px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:12px}.stat small{display:block;color:var(--muted);font-size:.58rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.stat strong{display:block;font-size:1.45rem;margin-top:5px}.toolbar{display:flex;gap:7px;align-items:center;margin:12px 0;overflow:auto;padding-bottom:2px}.filter{border:1px solid var(--line);background:white;color:var(--ink);border-radius:999px;padding:9px 13px;font-size:.71rem;font-weight:900;white-space:nowrap}.filter.active{background:var(--ocean);color:white;border-color:var(--ocean)}.updated{margin-left:auto;color:var(--muted);font-size:.62rem;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 7px 24px rgba(5,27,31,.06)}.cardHead{display:flex;gap:10px;align-items:flex-start;padding:14px;border-bottom:1px solid var(--line)}.stationIcon{width:42px;height:42px;border-radius:13px;background:#edf2ee;display:grid;place-items:center;font-size:1.2rem;flex:0 0 auto}.orderNo{font-size:1.3rem;font-weight:950;line-height:1}.where{font-size:.65rem;color:var(--muted);font-weight:800;margin-top:4px}.wait{margin-left:auto;text-align:right}.wait strong{display:block;font-size:.86rem;color:var(--ok)}.wait.warn strong{color:var(--warn)}.wait.late strong{color:var(--danger)}.wait small{display:block;color:var(--muted);font-size:.55rem;margin-top:2px}.stationTag{display:inline-flex;margin:11px 14px 0;border-radius:999px;padding:5px 8px;background:#e9f2ef;color:var(--teal);font-size:.57rem;font-weight:950;text-transform:uppercase;letter-spacing:.06em}.stationTag.bar{background:#e8f1f8;color:#2f6488}.body{padding:12px 14px}.items{display:grid;gap:9px}.item{display:grid;grid-template-columns:30px 1fr;gap:8px}.qty{width:30px;height:30px;border-radius:9px;background:var(--ocean);color:white;display:grid;place-items:center;font-size:.72rem;font-weight:950}.item b{display:block;font-size:.82rem;line-height:1.15}.opts{font-size:.62rem;color:var(--muted);line-height:1.35;margin-top:3px}.notes{margin-top:10px;padding:9px 10px;border-radius:12px;background:#fff8ed;border:1px solid #f0dcc0;font-size:.67rem;line-height:1.4}.deliver{width:calc(100% - 28px);margin:0 14px 14px;border:0;border-radius:14px;min-height:50px;background:var(--amber);color:#25160b;font-weight:950;cursor:pointer}.deliveredBox{margin:0 14px 14px;border-radius:14px;padding:10px 11px;background:#e4f0e8;color:var(--ok);font-size:.66rem;font-weight:850;line-height:1.45}.empty{grid-column:1/-1;background:white;border:1px dashed #c7cec9;border-radius:20px;padding:48px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:1rem;margin-bottom:5px}.toast{position:fixed;left:50%;bottom:18px;z-index:100;transform:translate(-50%,20px);opacity:0;background:#04171b;color:white;padding:10px 13px;border-radius:12px;font-size:.7rem;font-weight:850;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.topActions a{display:none}.main{padding:9px 8px 28px}.hero{border-radius:18px}.updated{display:none}}
</style></head><body><header class="top"><div class="topRow"><div class="brand"><img src="assets/logo.png" alt="CHIDOLIRO"><div><b>CHIDOLIRO</b><small>ENTREGA A MESA</small></div></div><div class="topActions"><a href="/pos.html">POS</a><a href="/panel.html">Panel</a><button id="logout">Salir</button></div></div></header><main class="main"><section class="hero"><div class="heroText"><small>MESEROS</small><h1>Listos para entregar</h1><p>Cocina y Barra marcan cuando terminan. El mesero confirma aquí el momento real en que el alimento o bebida llega al cliente.</p></div></section><section class="stats"><div class="stat"><small>Pendientes</small><strong id="pending">0</strong></div><div class="stat"><small>Comida lista</small><strong id="food">0</strong></div><div class="stat"><small>Bebidas listas</small><strong id="drinks">0</strong></div><div class="stat"><small>Promedio entrega</small><strong id="avg">—</strong></div></section><div class="toolbar"><button class="filter active" data-filter="pending">Por entregar</button><button class="filter" data-filter="kitchen">Comida</button><button class="filter" data-filter="bar">Bebidas</button><button class="filter" data-filter="recent">Entregados recientes</button><span class="updated" id="updated">—</span></div><section class="grid" id="grid"><div class="empty">Cargando entregas…</div></section></main><div class="toast" id="toast"></div><script>
(()=>{const KEY='chidoliro_kitchen_session';const state={session:sessionStorage.getItem(KEY)||'',rows:[],filter:'pending',timer:null};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}async function api(body){const r=await fetch('/api/kitchen',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json',Authorization:`Bearer ${state.session}`},body:JSON.stringify(body||{})});const p=await r.json().catch(()=>null);if(r.status===401){sessionStorage.removeItem(KEY);location.replace('/panel.html');throw new Error('Sesión vencida')}if(r.status===403){location.replace('/panel.html');throw new Error('Sin permiso')}if(!r.ok||!p?.ok)throw new Error(p?.error||'request_failed');return p}function fmtSec(s){s=Math.max(0,Number(s||0));if(s<60)return `${s}s`;const m=Math.floor(s/60);return m<60?`${m} min`:`${Math.floor(m/60)}h ${m%60}m`}function optText(a){return Array.isArray(a)?a.map(x=>x.name||x.label||'').filter(Boolean).join(' · '):''}function waitClass(sec){return sec>=600?'late':sec>=300?'warn':''}function renderStats(){const pending=state.rows.filter(x=>!x.delivered_at);const delivered=state.rows.filter(x=>x.delivered_at&&x.delivery_seconds!=null);document.getElementById('pending').textContent=pending.length;document.getElementById('food').textContent=pending.filter(x=>x.station==='kitchen').length;document.getElementById('drinks').textContent=pending.filter(x=>x.station==='bar').length;document.getElementById('avg').textContent=delivered.length?fmtSec(Math.round(delivered.reduce((a,x)=>a+Number(x.delivery_seconds||0),0)/delivered.length)):'—'}function rows(){if(state.filter==='pending')return state.rows.filter(x=>!x.delivered_at);if(state.filter==='recent')return state.rows.filter(x=>!!x.delivered_at);return state.rows.filter(x=>!x.delivered_at&&x.station===state.filter)}function render(){renderStats();const box=document.getElementById('grid'),data=rows();box.innerHTML=data.length?data.map(x=>{const delivered=!!x.delivered_at,wait=delivered?Number(x.delivery_seconds||0):Number(x.ready_wait_seconds||0),station=x.station==='bar'?'Bebidas':'Cocina',icon=x.station==='bar'?'🥤':'🍽️',where=x.order_type==='table'?`Mesa ${esc(x.table_reference||'—')}`:`Para llevar · ${esc(x.customer_name||'')}`,items=(x.items||[]).map(i=>`<div class="item"><div class="qty">${Number(i.quantity||1)}×</div><div><b>${esc(i.item_name)}</b>${optText(i.selected_options)?`<div class="opts">${esc(optText(i.selected_options))}</div>`:''}${i.notes?`<div class="opts">Nota: ${esc(i.notes)}</div>`:''}</div></div>`).join('');return `<article class="card"><div class="cardHead"><div class="stationIcon">${icon}</div><div><div class="orderNo">#${esc(x.order_number)}</div><div class="where">${where}</div></div><div class="wait ${waitClass(wait)}"><strong>${fmtSec(wait)}</strong><small>${delivered?'tiempo de entrega':'esperando mesero'}</small></div></div><div class="stationTag ${x.station==='bar'?'bar':''}">${station}</div><div class="body"><div class="items">${items}</div>${x.notes?`<div class="notes">Pedido: ${esc(x.notes)}</div>`:''}</div>${delivered?`<div class="deliveredBox">✓ Entregado ${new Date(x.delivered_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}${x.delivered_by?.display_name?` por ${esc(x.delivered_by.display_name)}`:''}<br>Desde listo hasta mesa: ${fmtSec(x.delivery_seconds)}</div>`:`<button class="deliver" data-order="${esc(x.order_id)}" data-station="${esc(x.station)}">✓ Marcar entregado al cliente</button>`}</article>`}).join(''):'<div class="empty"><strong>No hay entregas pendientes</strong>Cuando Cocina o Barra marquen algo como listo aparecerá aquí automáticamente.</div>';box.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>mark(b.dataset.order,b.dataset.station,b))}async function load(){if(!state.session){location.replace('/panel.html');return}try{const p=await api({action:'delivery_list'});state.rows=p.deliveries||[];render();document.getElementById('updated').textContent='Actualizado '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}catch(e){toast(e.message)}}async function mark(order,station,btn){if(!confirm(`¿Confirmar que ${station==='bar'?'las bebidas':'los alimentos'} ya fueron entregados al cliente?`))return;btn.disabled=true;try{const p=await api({action:'mark_delivered',order_id:order,station});toast(p.order_complete?'Pedido completo entregado':'Entrega registrada');await load()}catch(e){toast(e.message);btn.disabled=false}}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filter=b.dataset.filter;render()});document.getElementById('logout').onclick=async()=>{try{await api({action:'logout'})}catch(_){}sessionStorage.removeItem(KEY);location.replace('/panel.html')};load();state.timer=setInterval(load,3000)})();
</script></body></html>
