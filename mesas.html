<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082a31"><title>CHIDOLIRO · QR de mesas</title><style>:root{--ocean:#082a31;--teal:#137a7e;--cream:#f6f0e7;--amber:#f09a52;--ink:#152728;--muted:#6c7977;--line:rgba(21,39,40,.12)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#04171b;color:white}button,input{font:inherit}.hidden{display:none!important}.login{min-height:100dvh;display:grid;place-items:center;padding:24px}.loginCard,.panel{background:var(--cream);color:var(--ink);border-radius:26px}.loginCard{width:min(100%,430px);padding:26px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:56px}.brand b{letter-spacing:.12em}.brand small{display:block;color:var(--teal);font-size:.65rem;font-weight:800;margin-top:2px}.loginCard h1{font-size:2rem;margin:24px 0 6px}.loginCard p{color:var(--muted);font-size:.82rem}.pin{width:100%;height:58px;border:1px solid var(--line);border-radius:15px;background:white;text-align:center;font-size:1.4rem;font-weight:900;letter-spacing:.25em;margin-top:12px}.btn{border:0;border-radius:14px;min-height:48px;padding:0 16px;font-weight:900;cursor:pointer}.primary{background:var(--ocean);color:white}.accent{background:var(--amber);color:#25160b}.loginBtn{width:100%;margin-top:9px}.error{min-height:20px;color:#b33d3d;font-size:.72rem;font-weight:800;text-align:center;margin-top:8px}.app{min-height:100dvh;background:#eef0eb;color:var(--ink)}.top{background:var(--ocean);color:white;padding:12px 16px;position:sticky;top:0;z-index:20}.topRow{max-width:1200px;margin:auto;display:flex;align-items:center;gap:12px}.top .brand img{width:44px}.top .brand small{color:#7bc9c4}.topActions{margin-left:auto;display:flex;gap:8px}.main{max-width:1200px;margin:auto;padding:18px 14px 40px}.panel{padding:18px;border:1px solid var(--line)}.setup{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:5px}.field span{font-size:.7rem;font-weight:900}.field input{height:48px;border:1px solid var(--line);border-radius:13px;background:white;padding:0 12px;min-width:150px}.note{color:var(--muted);font-size:.72rem;line-height:1.5;margin-top:10px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.qrCard{background:white;border:1px solid var(--line);border-radius:20px;padding:16px;text-align:center;break-inside:avoid}.qrCard h2{font-size:1.4rem;margin:0 0 10px}.qr{width:200px;height:200px;max-width:100%;margin:auto;display:grid;place-items:center}.qr img,.qr canvas{max-width:100%!important;height:auto!important}.url{font-size:.56rem;color:var(--muted);word-break:break-all;margin-top:9px}.empty{grid-column:1/-1;padding:45px 20px;text-align:center;color:var(--muted);background:white;border-radius:20px;border:1px dashed #c6cdc8}.printBtn{margin-left:auto}@media(max-width:800px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.cards{grid-template-columns:1fr}.setup{align-items:stretch}.field input,.setup .btn{width:100%}.printBtn{margin-left:0}}@media print{body,.app{background:white}.top,.panel.setupPanel,.note{display:none!important}.main{max-width:none;padding:0}.cards{grid-template-columns:repeat(2,1fr);gap:8mm;margin:0}.qrCard{border:1px solid #bbb;border-radius:6mm;padding:8mm}.url{font-size:7pt}.qr{width:45mm;height:45mm}}</style></head><body><section class="login" id="loginView"><div class="loginCard"><div class="brand"><img src="assets/logo.png" alt="CHIDOLIRO"><div><b>CHIDOLIRO</b><small>QR DE MESAS</small></div></div><h1>Acceso interno</h1><p>Usa el mismo PIN del centro de comandas.</p><form id="loginForm"><input class="pin" id="pin" inputmode="numeric" maxlength="6" placeholder="••••••"><button class="btn primary loginBtn" type="submit">Entrar</button></form><div class="error" id="err"></div></div></section><section class="app hidden" id="appView"><header class="top"><div class="topRow"><div class="brand"><img src="assets/logo.png" alt="CHIDOLIRO"><div><b>CHIDOLIRO</b><small>QR POR MESA</small></div></div><div class="topActions"><button class="btn accent" id="printBtn">Imprimir QR</button><button class="btn" id="logoutBtn">Salir</button></div></div></header><main class="main"><section class="panel setupPanel"><div class="setup"><label class="field"><span>Número total de mesas</span><input id="count" type="number" min="1" max="100" placeholder="Ej. 12"></label><button class="btn primary" id="sync">Crear / actualizar mesas</button><button class="btn" id="reload">Actualizar</button></div><div class="note">Cada mesa recibe un enlace único. Aunque alguien cambie manualmente el número en la URL, el QR oficial usa un token distinto para identificar la mesa correcta.</div></section><section class="cards" id="cards"><div class="empty">Cargando mesas…</div></section></main></section><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIUDxzaGDF/YTLlG3fJUf+W3w5hH2jL7tUjxDSA0J4Xz8IYZslqQ+9bR6f3PyNJxA5Hzwv1u3R6wHMxv1N7A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script><script>(()=>{const KEY='chidoliro_kitchen_session';let session=sessionStorage.getItem(KEY)||'';const login=document.getElementById('loginView'),app=document.getElementById('appView'),cards=document.getElementById('cards');function showApp(){login.classList.add('hidden');app.classList.remove('hidden');load()}function showLogin(){app.classList.add('hidden');login.classList.remove('hidden');document.getElementById('pin').focus()}async function kitchen(body){const r=await fetch('/api/kitchen',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json',...(session?{Authorization:`Bearer ${session}`}:{})},body:JSON.stringify(body)});const p=await r.json().catch(()=>null);if(!r.ok||!p?.ok)throw new Error(p?.error||'error');return p}async function tables(method='GET',body){const r=await fetch('/api/tables',{method,cache:'no-store',headers:{'Content-Type':'application/json',Authorization:`Bearer ${session}`},body:method==='POST'?JSON.stringify(body):undefined});const p=await r.json().catch(()=>null);if(r.status===401){session='';sessionStorage.removeItem(KEY);showLogin();throw new Error('Sesión vencida')}if(!r.ok||!p?.ok)throw new Error(p?.error||'error');return p}function render(list){const active=(list||[]).filter(t=>t.is_active);if(!active.length){cards.innerHTML='<div class="empty">Aún no hay mesas configuradas. Indica el total de mesas y pulsa “Crear / actualizar”.</div>';return}cards.innerHTML=active.map(t=>`<article class="qrCard"><h2>Mesa ${String(t.name).replace(/[<>]/g,'')}</h2><div class="qr" data-token="${t.qr_token}"></div><div class="url"></div></article>`).join('');cards.querySelectorAll('.qr').forEach(el=>{const token=el.dataset.token;const url=`${location.origin}/?mesa=${encodeURIComponent(token)}`;el.nextElementSibling.textContent=url;if(window.QRCode)new QRCode(el,{text:url,width:200,height:200,colorDark:'#082a31',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});else el.textContent='QR no disponible';});}async function load(){cards.innerHTML='<div class="empty">Cargando mesas…</div>';try{const p=await tables('GET');render(p.tables)}catch(e){cards.innerHTML=`<div class="empty">${e.message}</div>`}}document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const pin=document.getElementById('pin').value.replace(/\D/g,'').slice(0,6),err=document.getElementById('err');err.textContent='';try{const p=await kitchen({action:'login',pin});session=p.token;sessionStorage.setItem(KEY,session);showApp()}catch(x){err.textContent=x.message==='invalid_pin'?'PIN incorrecto.':'No pudimos iniciar sesión.'}});document.getElementById('sync').addEventListener('click',async()=>{const count=Number(document.getElementById('count').value);if(!Number.isInteger(count)||count<1||count>100){alert('Indica entre 1 y 100 mesas.');return}try{const p=await tables('POST',{count});render(p.tables)}catch(e){alert(e.message)}});document.getElementById('reload').addEventListener('click',load);document.getElementById('printBtn').addEventListener('click',()=>window.print());document.getElementById('logoutBtn').addEventListener('click',()=>{session='';sessionStorage.removeItem(KEY);showLogin()});if(session)showApp();else showLogin();})();</script></body></html>
