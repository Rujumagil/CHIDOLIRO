<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082a31"><title>CHIDOLIRO · Estado de pedido</title>
<style>
:root{--ocean:#082a31;--teal:#137a7e;--aqua:#7bc9c4;--cream:#f6f0e7;--amber:#f09a52;--ink:#152728;--muted:#6c7977;--line:rgba(21,39,40,.12);--ok:#27784a;--danger:#b33d3d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#04171b;color:white}a{text-decoration:none;color:inherit}.shell{min-height:100dvh;background:linear-gradient(180deg,#082a31 0,#0a3b43 30%,#eef0eb 30%,#eef0eb 100%)}.top{max-width:760px;margin:auto;padding:18px 16px 28px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:52px;height:52px;object-fit:contain}.brand b{display:block;letter-spacing:.12em}.brand small{display:block;color:var(--aqua);font-size:.65rem;font-weight:800;letter-spacing:.1em;margin-top:2px}.card{max-width:760px;margin:-4px auto 30px;background:var(--cream);color:var(--ink);border-radius:28px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.22)}.statusTop{display:flex;gap:12px;align-items:flex-start}.orderNo{font-size:2.4rem;font-weight:950;line-height:1}.meta{color:var(--muted);font-size:.76rem;margin-top:5px}.live{margin-left:auto;display:flex;align-items:center;gap:6px;border-radius:999px;background:#e2efe9;color:#1d6b52;padding:7px 10px;font-size:.68rem;font-weight:900}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#3fb876}.headline{font-size:2rem;line-height:1.02;margin:24px 0 7px}.sub{margin:0;color:var(--muted);font-size:.86rem;line-height:1.55}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:22px 0}.step{position:relative;text-align:center}.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#dfe3de;color:#84908c;font-size:.78rem;font-weight:900;position:relative;z-index:2}.step.done .dot{background:var(--teal);color:white}.step.current .dot{background:var(--amber);color:#25160b;box-shadow:0 0 0 5px rgba(240,154,82,.18)}.step:after{content:"";position:absolute;top:16px;left:58%;right:-42%;height:3px;background:#dfe3de}.step.done:after{background:var(--teal)}.step:last-child:after{display:none}.step span{display:block;margin-top:6px;font-size:.59rem;color:var(--muted);font-weight:800}.step.current span,.step.done span{color:var(--ink)}.notice{border-radius:17px;background:white;border:1px solid var(--line);padding:14px;margin-top:18px}.notice strong{display:block;font-size:.9rem}.notice p{margin:5px 0 0;color:var(--muted);font-size:.74rem;line-height:1.45}.items{display:grid;gap:9px;margin-top:16px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:white;border:1px solid var(--line);border-radius:16px;padding:12px}.qty{width:31px;height:31px;border-radius:10px;background:var(--ocean);color:white;display:grid;place-items:center;font-size:.75rem;font-weight:900}.item b{font-size:.84rem;line-height:1.2}.opts{font-size:.65rem;color:var(--muted);margin-top:4px}.price{font-size:.76rem;font-weight:900}.total{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}.total strong{font-size:1.25rem}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.btn{min-height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.78rem}.primary{background:var(--ocean);color:white}.secondary{background:white;border:1px solid var(--line);color:var(--ocean)}.error{max-width:760px;margin:20px auto;background:#fff7ef;color:var(--ink);border-radius:22px;padding:24px;text-align:center}.error h1{font-size:1.6rem}.error p{color:var(--muted);line-height:1.5}.cancelled{background:#fde6e6!important;color:var(--danger)!important}.footer{max-width:760px;margin:auto;padding:0 16px 32px;color:rgba(255,255,255,.58);font-size:.68rem;text-align:center}
@media(max-width:600px){.top{padding-top:12px}.card{margin:0;border-radius:28px 28px 0 0;min-height:calc(100dvh - 92px);padding:18px 13px 28px}.steps{gap:2px}.step span{font-size:.52rem}.dot{width:30px;height:30px}.step:after{top:14px}.actions{grid-template-columns:1fr}.headline{font-size:1.75rem}}
</style></head>
<body><div class="shell"><header class="top"><div class="brand"><img src="assets/logo.png" alt="CHIDOLIRO"><div><b>CHIDOLIRO</b><small>SEGUIMIENTO DE PEDIDO</small></div></div></header><main id="root"></main><div class="footer">El estado se actualiza automáticamente mientras preparan tu pedido.</div></div>
<script>
(()=>{
const root=document.getElementById('root');const token=(new URLSearchParams(location.search).get('t')||'').trim();let timer=null;const orderSteps=['submitted','accepted','preparing','ready','delivered'];const labels={submitted:'Recibido',accepted:'Aceptado',preparing:'Preparando',ready:'Listo',delivered:'Entregado'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(v){return '$'+Number(v||0).toLocaleString('es-MX',{maximumFractionDigits:2})}function optText(v){return Array.isArray(v)?v.map(x=>x?.name||'').filter(Boolean).join(' · '):''}
function message(o){if(o.status==='cancelled')return['Pedido cancelado','El restaurante marcó este pedido como cancelado.'];if(o.status==='submitted')return['Recibimos tu pedido','La comanda ya llegó al restaurante y está esperando confirmación.'];if(o.status==='accepted')return['Pedido confirmado','El equipo ya aceptó tu pedido y pronto comenzará a prepararlo.'];if(o.status==='preparing')return['Ya lo están preparando','Tu pedido está en cocina.'];if(o.status==='ready')return o.order_type==='takeout'?['¡Listo para recoger!','Tu pedido ya está listo. Puedes pasar por él.']:['¡Tu pedido está listo!','La cocina terminó la preparación y será entregado en tu mesa.'];if(o.status==='delivered')return['Pedido entregado','Gracias por visitar CHIDOLIRO.'];return['Estado de tu pedido','Estamos actualizando la información.']}
function render(o){const [title,subtitle]=message(o);const idx=orderSteps.indexOf(o.status);root.innerHTML=`<section class="card"><div class="statusTop"><div><div class="orderNo">#${esc(o.order_number)}</div><div class="meta">${o.order_type==='table'?`Mesa ${esc(o.table_reference||'—')}`:'Pedido para llevar'} · ${new Date(o.created_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</div></div><div class="live ${o.status==='cancelled'?'cancelled':''}">${o.status==='cancelled'?'Cancelado':'En vivo'}</div></div><h1 class="headline">${esc(title)}</h1><p class="sub">${esc(subtitle)}</p>${o.status==='cancelled'?'':`<div class="steps">${orderSteps.map((s,i)=>`<div class="step ${i<idx?'done':''} ${i===idx?'current':''}"><div class="dot">${i<idx?'✓':i+1}</div><span>${labels[s]}</span></div>`).join('')}</div>`}<div class="notice"><strong>${o.order_type==='takeout'?'🛍 Pedido para llevar':'🍽 Pedido en mesa'}</strong><p>${o.order_type==='takeout'?'Conserva esta pantalla para saber cuándo pasar por tu pedido.':`Esta comanda está ligada a la mesa ${esc(o.table_reference||'—')}.`}</p></div><div class="items">${(o.items||[]).map(i=>`<article class="item"><div class="qty">${Number(i.quantity||1)}×</div><div><b>${esc(i.name)}</b>${optText(i.selected_options)?`<div class="opts">${esc(optText(i.selected_options))}</div>`:''}${i.notes?`<div class="opts">Nota: ${esc(i.notes)}</div>`:''}</div><div class="price">${money(i.line_total)}</div></article>`).join('')}</div><div class="total"><span>Total</span><strong>${money(o.total)}</strong></div><div class="actions"><a class="btn primary" href="/">Volver al menú</a><button class="btn secondary" style="border:1px solid var(--line);cursor:pointer" id="refresh">Actualizar ahora</button></div></section>`;document.getElementById('refresh')?.addEventListener('click',load);if(['delivered','cancelled'].includes(o.status)){clearInterval(timer);timer=null;}}
async function load(){if(!token){root.innerHTML='<section class="error"><h1>No encontramos tu pedido</h1><p>Abre el enlace que recibiste al confirmar tu compra.</p><a href="/">Volver a CHIDOLIRO</a></section>';return}try{const r=await fetch(`/api/order-status?token=${encodeURIComponent(token)}`,{cache:'no-store'});const p=await r.json();if(!r.ok||!p?.ok)throw new Error('not_found');render(p.order)}catch(_){root.innerHTML='<section class="error"><h1>No pudimos cargar el pedido</h1><p>Revisa que el enlace sea correcto o intenta nuevamente.</p><button onclick="location.reload()">Intentar de nuevo</button></section>'}}
load();timer=setInterval(load,5000);
})();
</script></body></html>
