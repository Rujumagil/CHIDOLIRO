<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082a31"><title>CHIDOLIRO · Estado de reservación</title>
<style>
:root{--ocean:#082a31;--teal:#137a7e;--aqua:#7bc9c4;--cream:#f6f0e7;--amber:#f09a52;--ink:#152728;--muted:#6c7977;--line:rgba(21,39,40,.12);--danger:#b33d3d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#04171b;color:white}a{text-decoration:none;color:inherit}button{font:inherit}.shell{min-height:100dvh;background:linear-gradient(180deg,#082a31 0,#0a3b43 30%,#eef0eb 30%,#eef0eb 100%)}.top{max-width:720px;margin:auto;padding:18px 16px 28px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:52px;height:52px;object-fit:contain}.brand b{display:block;letter-spacing:.12em}.brand small{display:block;color:var(--aqua);font-size:.65rem;font-weight:800;letter-spacing:.1em;margin-top:2px}.card{max-width:720px;margin:-4px auto 30px;background:var(--cream);color:var(--ink);border-radius:28px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.22)}.statusTop{display:flex;gap:12px;align-items:flex-start}.reservationNo{font-size:2rem;font-weight:950;line-height:1}.meta{color:var(--muted);font-size:.76rem;margin-top:5px}.live{margin-left:auto;display:flex;align-items:center;gap:6px;border-radius:999px;background:#e2efe9;color:#1d6b52;padding:7px 10px;font-size:.68rem;font-weight:900}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#3fb876}.headline{font-size:2rem;line-height:1.02;margin:24px 0 7px}.sub{margin:0;color:var(--muted);font-size:.86rem;line-height:1.55}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:22px 0}.step{position:relative;text-align:center}.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin:auto;background:#dfe3de;color:#84908c;font-size:.78rem;font-weight:900;position:relative;z-index:2}.step.done .dot{background:var(--teal);color:white}.step.current .dot{background:var(--amber);color:#25160b;box-shadow:0 0 0 5px rgba(240,154,82,.18)}.step:after{content:"";position:absolute;top:16px;left:58%;right:-42%;height:3px;background:#dfe3de}.step.done:after{background:var(--teal)}.step:last-child:after{display:none}.step span{display:block;margin-top:6px;font-size:.59rem;color:var(--muted);font-weight:800}.summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.fact{background:white;border:1px solid var(--line);border-radius:16px;padding:12px}.fact span{display:block;color:var(--muted);font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.fact b{display:block;font-size:.84rem;margin-top:5px}.notice{border-radius:17px;background:white;border:1px solid var(--line);padding:14px;margin-top:14px}.notice strong{display:block;font-size:.9rem}.notice p{margin:5px 0 0;color:var(--muted);font-size:.74rem;line-height:1.45}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.btn{min-height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.78rem;border:0}.primary{background:var(--ocean);color:white}.secondary{background:white;border:1px solid var(--line);color:var(--ocean)}.cancelled{background:#fde6e6!important;color:var(--danger)!important}.error{max-width:720px;margin:20px auto;background:#fff7ef;color:var(--ink);border-radius:22px;padding:24px;text-align:center}.error p{color:var(--muted);line-height:1.5}.footer{max-width:720px;margin:auto;padding:0 16px 32px;color:rgba(255,255,255,.58);font-size:.68rem;text-align:center}@media(max-width:600px){.top{padding-top:12px}.card{margin:0;border-radius:28px 28px 0 0;min-height:calc(100dvh - 92px);padding:18px 13px 28px}.steps{gap:2px}.step span{font-size:.51rem}.dot{width:30px;height:30px}.step:after{top:14px}.actions,.summary{grid-template-columns:1fr}.headline{font-size:1.75rem}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><img src="assets/logo.png" alt="CHIDOLIRO"><div><b>CHIDOLIRO</b><small>SEGUIMIENTO DE RESERVACIÓN</small></div></div></header><main id="root"></main><div class="footer">El estado se actualiza automáticamente cuando el restaurante confirma tu solicitud.</div></div>
<script>(()=>{const root=document.getElementById('root');const token=(new URLSearchParams(location.search).get('t')||'').trim();let timer=null;const steps=['requested','confirmed','seated','completed'];const labels={requested:'Solicitada',confirmed:'Confirmada',seated:'En mesa',completed:'Completada'};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function formatDate(v){try{return new Date(`${v}T12:00:00`).toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}catch(_){return v}}function message(r){if(r.status==='cancelled')return['Reservación cancelada','La reservación fue marcada como cancelada.'];if(r.status==='requested')return['Solicitud recibida','CHIDOLIRO ya recibió tu solicitud y está pendiente de confirmación.'];if(r.status==='confirmed')return['¡Mesa confirmada!','Tu reservación está confirmada. Te esperamos.'];if(r.status==='seated')return['Bienvenido a CHIDOLIRO','Tu mesa ya fue registrada como atendida.'];if(r.status==='completed')return['Gracias por visitarnos','Esperamos que hayas disfrutado la experiencia.'];return['Estado de tu reservación','Estamos actualizando la información.']}function render(r){const [title,sub]=message(r);const idx=steps.indexOf(r.status);root.innerHTML=`<section class="card"><div class="statusTop"><div><div class="reservationNo">R-${esc(r.reservation_number)}</div><div class="meta">${esc(r.customer_name||'Reservación')}</div></div><div class="live ${r.status==='cancelled'?'cancelled':''}">${r.status==='cancelled'?'Cancelada':'En vivo'}</div></div><h1 class="headline">${esc(title)}</h1><p class="sub">${esc(sub)}</p>${r.status==='cancelled'?'':`<div class="steps">${steps.map((s,i)=>`<div class="step ${i<idx?'done':''} ${i===idx?'current':''}"><div class="dot">${i<idx?'✓':i+1}</div><span>${labels[s]}</span></div>`).join('')}</div>`}<div class="summary"><div class="fact"><span>Fecha</span><b>${esc(formatDate(r.reservation_date))}</b></div><div class="fact"><span>Hora</span><b>${esc(r.reservation_time)}</b></div><div class="fact"><span>Personas</span><b>${Number(r.party_size||0)}</b></div><div class="fact"><span>Estado</span><b>${esc(labels[r.status]||r.status)}</b></div></div><div class="notice"><strong>📍 CHIDOLIRO · Nuevo Urecho</strong><p>Nacional s/n, 61750 Nuevo Urecho, Michoacán. Llega con unos minutos de anticipación para disfrutar la experiencia.</p></div><div class="actions"><a class="btn primary" href="/">Volver a CHIDOLIRO</a><button class="btn secondary" id="refresh">Actualizar ahora</button></div></section>`;document.getElementById('refresh')?.addEventListener('click',load);if(['completed','cancelled'].includes(r.status)){clearInterval(timer);timer=null;}}async function load(){if(!token){root.innerHTML='<section class="error"><h1>No encontramos tu reservación</h1><p>Abre el enlace que recibiste al solicitar tu mesa.</p><a href="/">Volver a CHIDOLIRO</a></section>';return}try{const x=await fetch(`/api/reservation-status?token=${encodeURIComponent(token)}`,{cache:'no-store'});const p=await x.json();if(!x.ok||!p?.ok)throw new Error('not_found');render(p.reservation)}catch(_){root.innerHTML='<section class="error"><h1>No pudimos cargar la reservación</h1><p>Revisa que el enlace sea correcto o intenta nuevamente.</p><button onclick="location.reload()">Intentar de nuevo</button></section>'}}load();timer=setInterval(load,12000);})();</script></body></html>
