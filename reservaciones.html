<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#04171b"><title>CHIDOLIRO · Reservaciones</title><style>
:root{--ocean:#082a31;--teal:#137a7e;--aqua:#7bc9c4;--cream:#f6f0e7;--amber:#f09a52;--ink:#152728;--muted:#72807e;--line:rgba(21,39,40,.12);--danger:#b83c3c;--ok:#27784a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#04171b;color:white}button,input{font:inherit}.hidden{display:none!important}.login{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#0e5055 0,#06252b 38%,#04171b 72%)}.loginCard{width:min(100%,430px);background:var(--cream);color:var(--ink);border-radius:28px;padding:28px}.brand{display:flex;align-items:center;gap:11px}.brand img{width:58px}.brand b{display:block;letter-spacing:.12em}.brand small{display:block;color:var(--teal);font-size:.66rem;font-weight:800;letter-spacing:.1em;margin-top:3px}.loginCard h1{font-size:2.15rem;line-height:1;margin:28px 0 7px}.loginCard p{color:var(--muted);font-size:.85rem;line-height:1.5}.pin{width:100%;height:58px;border:1px solid var(--line);border-radius:16px;background:white;color:var(--ink);font-size:1.4rem;font-weight:900;letter-spacing:.28em;text-align:center;outline:none;margin-top:12px}.loginBtn{width:100%;height:52px;border:0;border-radius:15px;background:var(--ocean);color:white;font-weight:900;margin-top:10px}.error{min-height:20px;color:var(--danger);font-size:.73rem;font-weight:800;margin-top:8px;text-align:center}.app{min-height:100dvh;background:#edf0eb;color:var(--ink)}.top{position:sticky;top:0;z-index:20;background:rgba(4,23,27,.96);color:white;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.08)}.topRow{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.top .brand img{width:45px}.top .brand small{color:var(--aqua)}.topActions{margin-left:auto;display:flex;gap:7px}.iconBtn{min-height:40px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:white;border-radius:12px;padding:0 12px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center}.main{max-width:1100px;margin:auto;padding:18px 14px 38px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.toolbar h1{font-size:1.7rem;margin:0 auto 0 0}.date{min-height:44px;border:1px solid var(--line);border-radius:13px;background:white;color:var(--ink);padding:0 12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:13px}.stat{background:white;border:1px solid var(--line);border-radius:17px;padding:13px}.stat span{display:block;color:var(--muted);font-size:.63rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em}.stat b{display:block;font-size:1.55rem;margin-top:4px}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 7px 24px rgba(5,27,31,.07)}.cardTop{display:flex;gap:10px;align-items:start}.number{font-size:1.35rem;font-weight:950}.time{margin-left:auto;font-size:1.35rem;font-weight:950;color:var(--teal)}.name{font-weight:900;margin-top:10px}.phone{font-size:.72rem;color:var(--muted);margin-top:2px}.facts{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.chip{border-radius:999px;padding:6px 9px;background:#edf1eb;font-size:.65rem;font-weight:850}.status{background:#fff0df;color:#9a591d}.status.confirmed{background:#e2efe9;color:#1d6b52}.status.seated{background:#e6f0f3;color:#1f596a}.notes{margin-top:11px;padding:10px;border-radius:12px;background:#fff8ed;border:1px solid #f0dcc0;font-size:.7rem;line-height:1.4}.actions{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:13px}.next{border:0;border-radius:13px;min-height:44px;background:var(--amber);color:#25160b;font-weight:900}.cancel{border:1px solid var(--line);border-radius:13px;background:white;color:var(--danger);min-height:44px;padding:0 12px;font-weight:850}.empty{grid-column:1/-1;background:white;border:1px dashed #c7d0ca;border-radius:20px;padding:45px 20px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,18px);opacity:0;background:#04171b;color:white;padding:11px 14px;border-radius:13px;font-size:.74rem;font-weight:850;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.list{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.toolbar h1{width:100%}.main{padding:12px 10px 30px}.top .brand small{display:none}.iconBtn{padding:0 9px}}
</style></head><body>
<section class="login" id="login"><div class="loginCard"><div class="brand"><img src="assets/logo.png" alt="CHIDOLIRO"><div><b>CHIDOLIRO</b><small>RESERVACIONES</small></div></div><h1>Agenda del restaurante</h1><p>Usa el mismo PIN de cocina para confirmar y administrar las reservaciones del día.</p><form id="loginForm"><input class="pin" id="pin" inputmode="numeric" maxlength="6" placeholder="••••••"><button class="loginBtn">Entrar</button></form><div class="error" id="loginError"></div></div></section>
<section class="app hidden" id="app"><header class="top"><div class="topRow"><div class="brand"><img src="assets/logo.png" alt="CHIDOLIRO"><div><b>CHIDOLIRO</b><small>RESERVACIONES EN VIVO</small></div></div><div class="topActions"><a class="iconBtn" href="/cocina.html">Comandas</a><button class="iconBtn" id="logout">Salir</button></div></div></header><main class="main"><div class="toolbar"><h1>Reservaciones</h1><input type="date" class="date" id="date"><button class="iconBtn" style="background:var(--ocean)" id="refresh">Actualizar</button></div><section class="stats"><div class="stat"><span>Solicitadas</span><b id="sRequested">0</b></div><div class="stat"><span>Confirmadas</span><b id="sConfirmed">0</b></div><div class="stat"><span>En mesa</span><b id="sSeated">0</b></div><div class="stat"><span>Total activas</span><b id="sTotal">0</b></div></section><section class="list" id="list"></section></main></section><div class="toast" id="toast"></div>
<script>(()=>{const KEY='chidoliro_kitchen_session';const state={session:sessionStorage.getItem(KEY)||'',rows:[],timer:null};const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function localDate(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}async function kitchenLogin(pin){const r=await fetch('/api/kitchen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',pin})});const p=await r.json().catch(()=>null);if(!r.ok||!p?.ok)throw new Error(p?.error||'PIN incorrecto');return p}async function api(method='GET',body){const date=$('#date')?.value||localDate();const url=method==='GET'?`/api/kitchen-reservations?date=${encodeURIComponent(date)}`:'/api/kitchen-reservations';const r=await fetch(url,{method,cache:'no-store',headers:{'Content-Type':'application/json',Authorization:`Bearer ${state.session}`},body:method==='POST'?JSON.stringify(body):undefined});const p=await r.json().catch(()=>null);if(r.status===401){logoutLocal();throw new Error('Sesión vencida');}if(!r.ok||!p?.ok)throw new Error(p?.error||'No se pudo conectar');return p}function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load();clearInterval(state.timer);state.timer=setInterval(load,10000)}function logoutLocal(){state.session='';sessionStorage.removeItem(KEY);clearInterval(state.timer);$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}function stats(){$('#sRequested').textContent=state.rows.filter(x=>x.status==='requested').length;$('#sConfirmed').textContent=state.rows.filter(x=>x.status==='confirmed').length;$('#sSeated').textContent=state.rows.filter(x=>x.status==='seated').length;$('#sTotal').textContent=state.rows.length}const next={requested:['confirmed','Confirmar mesa'],confirmed:['seated','Marcar llegada'],seated:['completed','Completar']};function render(){stats();const list=$('#list');if(!state.rows.length){list.innerHTML='<div class="empty"><b>No hay reservaciones activas para esta fecha</b><div>Las nuevas solicitudes aparecerán aquí.</div></div>';return}list.innerHTML=state.rows.map(r=>{const n=next[r.status];return `<article class="card"><div class="cardTop"><div><div class="number">R-${esc(r.reservation_number)}</div><div class="name">${esc(r.customer_name)}</div><div class="phone">${esc(r.customer_phone)}</div></div><div class="time">${esc(r.reservation_time)}</div></div><div class="facts"><span class="chip">👥 ${Number(r.party_size||0)} personas</span><span class="chip status ${esc(r.status)}">${r.status==='requested'?'Solicitada':r.status==='confirmed'?'Confirmada':r.status==='seated'?'En mesa':esc(r.status)}</span></div>${r.notes?`<div class="notes">${esc(r.notes)}</div>`:''}<div class="actions">${n?`<button class="next" data-id="${esc(r.id)}" data-status="${n[0]}">${n[1]}</button>`:'<div></div>'}<button class="cancel" data-id="${esc(r.id)}" data-status="cancelled">Cancelar</button></div></article>`}).join('');list.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>update(b.dataset.id,b.dataset.status)))}async function load(){try{const p=await api();state.rows=p.reservations||[];render()}catch(e){toast(e.message)}}async function update(id,status){if(status==='cancelled'&&!confirm('¿Cancelar esta reservación?'))return;try{await api('POST',{action:'update',reservation_id:id,status});toast(status==='confirmed'?'Reservación confirmada':status==='seated'?'Llegada registrada':status==='completed'?'Reservación completada':'Reservación cancelada');load()}catch(e){toast(e.message)}}$('#date').value=localDate();$('#date').addEventListener('change',load);$('#refresh').addEventListener('click',load);$('#logout').addEventListener('click',logoutLocal);$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const pin=$('#pin').value.replace(/\D/g,'').slice(0,6);$('#loginError').textContent='';try{const p=await kitchenLogin(pin);state.session=p.session_token;sessionStorage.setItem(KEY,state.session);showApp()}catch(err){$('#loginError').textContent='No pudimos iniciar sesión. Revisa el PIN.'}});if(state.session)showApp();})();</script></body></html>
